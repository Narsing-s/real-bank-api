name: Deploy to CloudHub 2.0 - DEV

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment: {description: Exact Anypoint Platform environment name, required: true, type: string, default: dev}
      target: {description: CloudHub 2.0 target/shared space name, required: true, type: string, default: Cloudhub-US-East-2}
      application_name: {description: CloudHub application name, required: true, type: string, default: real-bank-api}
      mule_runtime: {description: Mule runtime version, required: true, type: string, default: "4.9.0"}
      replicas: {description: Number of replicas for high availability, required: true, type: string, default: "2"}
      vcores:
        description: vCores per replica
        required: true
        type: choice
        options: ["0.1","0.2","0.5","1","1.5","2","2.5","3","3.5","4"]
        default: "0.1"
      munit: {description: Run MUnit before deployment, required: true, type: boolean, default: true}

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and deploy Real Bank API
    runs-on: ubuntu-latest
    environment: dev
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      BUSINESS_GROUP_ID: ${{ secrets.BUSINESS_GROUP_ID || secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
      DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
      DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
      DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
      DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
      DB_SF_USER: ${{ secrets.DB_SF_USER }}
      DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
      DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify required deployment and application secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG_ID DB_SF_NAME DB_SF_WAREHOUSE DB_SF_DATABASE DB_SF_SCHEMA DB_SF_USER DB_SF_PASSWORD DB_SF_ROLE EMAIL_USERNAME EMAIL_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ -z "${BUSINESS_GROUP_ID:-}" ]; then
            echo "::error::Missing GitHub secret: BUSINESS_GROUP_ID (or ANYPOINT_ORG_ID fallback)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure Maven authentication for Anypoint Exchange
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF
          chmod 600 "$HOME/.m2/settings.xml"

      - name: Build and run tests
        if: ${{ inputs.munit || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.m2/repository/com/github/everit-org/json-schema/org.everit.json.schema/1.12.2"
          mvn --batch-mode -U clean test

      - name: Show CloudHub 2 deployment target
        shell: bash
        run: |
          set -euo pipefail
          echo "Anypoint environment: ${{ inputs.environment || 'dev' }}"
          echo "CloudHub 2 target: ${{ inputs.target || 'Cloudhub-US-East-2' }}"
          echo "Application name: ${{ inputs.application_name || 'real-bank-api' }}"
          echo "Mule runtime: ${{ inputs.mule_runtime || '4.9.0' }}"

      - name: Deploy to CloudHub 2.0
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode -U clean deploy -DmuleDeploy \
            -Dcloudhub2.environment="${{ inputs.environment || 'dev' }}" \
            -Dcloudhub2.target="${{ inputs.target || 'Cloudhub-US-East-2' }}" \
            -Dcloudhub2.applicationName="${{ inputs.application_name || 'real-bank-api' }}" \
            -Dcloudhub2.muleVersion="${{ inputs.mule_runtime || '4.9.0' }}" \
            -Dcloudhub2.replicas="${{ inputs.replicas || '2' }}" \
            -Dcloudhub2.vCores="${{ inputs.vcores || '0.1' }}" \
            -Dcloudhub2.businessGroupId="$BUSINESS_GROUP_ID" \
            -Dcloudhub2.connectedAppClientId="$ANYPOINT_CLIENT_ID" \
            -Dcloudhub2.connectedAppClientSecret="$ANYPOINT_CLIENT_SECRET" \
            -Dcloudhub2.connectedAppGrantType="client_credentials"
